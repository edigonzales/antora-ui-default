<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="21"
     height="21">

  <style>
    polyline {
      fill: black;
      stroke: black;
      stroke-width: 1;
    }

    line {
      stroke: black;
      stroke-width: 1;
    }
  </style>

  <!-- WALLS -->
  <polyline points="3.5 9
                    3.5 19.5
                    8.5 19.5
                    8.5 13.5
                    12.5 13.5
                    12.5 19.5
                    17.5 19.5
                    17.5 9"
            stroke-linejoin="round"/>

  <!-- ROOF -->
  <line x1="1" y1="12" x2="10.5" y2="1.5"/>

  <polyline points="3.5 9.5
                    10.5 1.5
                    17.5 9.5"
            stroke-linejoin="miter"/>

  <line x1="20" y1="12" x2="10.5" y2="1.5"/>

  <!-- PIPE -->
  <polyline points="13.5 5
                    13.5 2.5
                    16.5 2.5
                    16.5 8"
            stroke-linejoin="round"/>
</svg>
