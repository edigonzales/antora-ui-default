<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="21"
     height="21">

  <style>
    polyline {
    fill: transparent;
    stroke: black;
    stroke-width: 1;
    }
  </style>

  <!-- WALLS -->
  <polyline points="3.5 9
                    3.5 19.5
                    8.5 19.5
                    8.5 13.5
                    12.5 13.5
                    12.5 19.5
                    17.5 19.5
                    17.5 9"
            stroke-linejoin="round"/>

  <!-- ROOF -->
  <polyline points="1 12
                    10.5 1.5
                    20 12"
            stroke-linejoin="miter"/>

  <!-- PIPE -->
  <polyline points="13.5 5
                    13.5 2.5
                    16.5 2.5
                    16.5 8"
            stroke-linejoin="round"/>
</svg>
