<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="24"
     height="24">

  <style>
    line {
    stroke: black;
    stroke-width: 1;
    }

    polyline {
    stroke: black;
    stroke: width: 1;
    fill: none;
    }
  </style>

  <!-- ↓ -->
  <line x1="13" y1="2" x2="13" y2="10"/>
  <polyline points="9 6
                    13 10
                    17 6"/>

  <!-- Dashed line -->
  <line x1="4" y1="12"
        x2="22" y2="12"
        stroke-dasharray="2, 2"/>

  <!-- ↑ -->
  <line x1="13" y1="14"
        x2="13" y2="22"/>
  <polyline points="9 18
                    13 14
                    17 18"/>
</svg>
